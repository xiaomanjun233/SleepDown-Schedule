name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 .github/scripts/pr_scope.py

  android:
    name: Android compile
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: compose-miuix-ui/miuix
          ref: c36fab72391801d1e3ea5a00f966bf16bac28d4c
          path: .ci/miuix
          persist-credentials: false
      - name: Apply public Miuix patches
        shell: bash
        run: |
          git -C .ci/miuix apply "$GITHUB_WORKSPACE/patches/miuix-0.9.3-sleepdown.patch"
          git -C .ci/miuix apply "$GITHUB_WORKSPACE/patches/miuix-cascading-popup-surface.patch"
          git -C .ci/miuix apply "$GITHUB_WORKSPACE/patches/miuix-scaffold-underlay.patch"
          git -C .ci/miuix apply "$GITHUB_WORKSPACE/patches/miuix-compact-dropdown.patch"
          git -C .ci/miuix apply "$GITHUB_WORKSPACE/patches/miuix-popup-slide-feedback.patch"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0'
      - name: Compile without release signing
        run: bash ./gradlew compileGithubReleaseKotlin -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --console=plain --no-daemon --no-parallel --max-workers=2 --stacktrace
      - name: Verify shared schemes, backups and reminder scheduling
        run: >-
          bash ./gradlew testGithubDebugUnitTest
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.PeriodSchemesTest'
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.ScheduleAdjustmentsTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.reminder.NotificationAdjustmentSchedulingTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.reminder.NotificationSchedulingTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.reminder.CourseSessionReminderTest'
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.PeriodSchemeLibraryTest'
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.PeriodTopologyMappingTest'
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.PeriodTimelineEditingTest'
          --tests 'com.xiaomanjun.sleepdownschedule.domain.schedule.PeriodTimelineChangesTest'
          --tests 'com.xiaomanjun.sleepdownschedule.DatabaseMigrationCoverageTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.settings.PeriodSchemeEditorSaveTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.ScheduleImportCustomCourseTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.WakeUpImportSessionTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.shiguang.ShiguangImportSessionCustomTimeTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.IcsScheduleCodecTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.AiImportDocumentTextTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.ChatGpt*Test'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.AiProviderPresetsTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.chatgpt.*Test'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.agent.AgentToolsTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.agent.AgentToolProtocolTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.importing.ImportedWeekNormalizationTest'
          --tests 'com.xiaomanjun.sleepdownschedule.data.repository.AutoRefreshTimingPreservationTest'
          --tests 'com.xiaomanjun.sleepdownschedule.SharedPeriodSchemeRepositoryTest'
          --tests 'com.xiaomanjun.sleepdownschedule.SharedPeriodSchemeMigrationTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.backup.BackupCodecTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.backup.BackupExportImportPlanTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.backup.BackupRoomRestoreTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.backup.BackupSettingsCompletenessTest'
          --tests 'com.xiaomanjun.sleepdownschedule.feature.backup.SharedPeriodSchemeBackupTest'
          -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix"
          -Psleepdown.useMavenMirrors=false
          --console=plain --no-daemon --no-parallel --max-workers=2 --stacktrace
      - name: Package unsigned debug build
        run: bash ./gradlew assembleGithubDebug -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --console=plain --no-daemon --no-parallel --max-workers=2

  result:
    name: PR checks
    if: always()
    needs: [scope, android]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$ANDROID_RESULT" = success || test "$ANDROID_RESULT" = skipped
