name: Deploy SleepDown website to Pages

on:
  push:
    branches:
      - main
    paths:
      - "sleepdown-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: sleepdown-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
