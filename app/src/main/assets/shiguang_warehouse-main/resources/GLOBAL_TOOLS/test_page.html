<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepDown 通用教务导入自检</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            margin: 0;
            padding: 24px;
            background: Canvas;
            color: CanvasText;
            line-height: 1.6;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        p {
            margin: 8px 0;
            color: color-mix(in srgb, CanvasText 72%, transparent);
        }
        .card {
            margin-top: 18px;
            padding: 16px;
            border-radius: 18px;
            background: color-mix(in srgb, CanvasText 8%, transparent);
        }
        code {
            word-break: break-all;
        }
    </style>
</head>
<body>
<main>
    <h1>通用教务导入自检</h1>
    <p>这个页面不访问校园网，也不会读取你的真实课表。</p>
    <div class="card">
        <p>点击右下角导入按钮后，将生成 4 门测试课程和 12 节标准作息，用来检查课程、周次、节次与时间映射。</p>
        <p>出现导入预览即表示链路正常。返回或点击“取消”不会写入数据；只有在预览页再次确认才会创建或覆盖课表。</p>
        <p>脚本路径：<code>GLOBAL_TOOLS/school.js</code></p>
    </div>
</main>
</body>
</html>
